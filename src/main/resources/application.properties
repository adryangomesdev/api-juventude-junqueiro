spring.application.namse=api-contato

# Configurações do Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Protocolos de segurança da conexão SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.cors.origens-permitidas=[https://portal-juventude-junqueiro.vercel.app](https://portal-juventude-junqueiro.vercel.app),http://localhost:3000,[http://192.168.1.7:3000](http://192.168.1.7:3000)