spring.application.name=api-contato

starttls.enable=true

api.cors.origens-permitidas=https://portal-juventude-junqueiro.vercel.app,http://localhost:3000,http://localhost:5173,http://192.168.1.7:3000

# Faz o Spring Boot ler automaticamente o arquivo .env localmente (ignorado no Render)
spring.config.import=optional:file:.env[.properties]

# Banco de Dados PostgreSQL (Supabase)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração JWT e Front-end (usa FRONTEND_URL no Render, ou localhost:5173 localmente)
jwt.secret=${JWT_SECRET}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# OAuth2 - Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.type(large)