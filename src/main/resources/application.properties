spring.application.namse=api-contato

starttls.enable=true

api.cors.origens-permitidas=[https://portal-juventude-junqueiro.vercel.app](https://portal-juventude-junqueiro.vercel.app),http://localhost:3000,[http://192.168.1.7:3000](http://192.168.1.7:3000)

# Faz o Spring Boot ler automaticamente o arquivo .env da pasta backend-juventude
spring.config.import=optional:file:.env[.properties]

# Banco de Dados PostgreSQL (Supabase)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA (Cria e atualiza as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração JWT e Front-end
jwt.secret=${JWT_SECRET}
app.frontend.url=http://localhost:5173

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# OAuth2 - Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.type(large)

